name: 发布 · 桌面应用

on:
  workflow_dispatch:
    inputs:
      operation:
        description: '操作：build 构建预发布；promote 将已有预发布转为稳定版'
        required: true
        default: build
        type: choice
        options: [build, promote]
      tag:
        description: '目标版本；转稳定版必填 vX.Y.Z，构建时留空使用 VERSION'
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  # 手动构建、tag 构建与晋级共用锁，避免重复提交公证或争用 latest。
  group: product-release
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: "1"

jobs:
  metadata:
    name: 准备 · 校验发布目标
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_notes: ${{ steps.version.outputs.release_notes }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      operation: ${{ steps.version.outputs.operation }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: 准备 · 获取源码与标签
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 准备 · 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 检查 · 版本与发布说明
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OPERATION: ${{ inputs.operation || 'build' }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/set-version.sh --check
          corepack yarn test:release
          corepack yarn test:ci
          corepack yarn product:release:check

  plugin-tests:
    name: 检查 · 内置插件回归
    needs: metadata
    uses: ./.github/workflows/test-builtin-plugins.yml
    with:
      ref: ${{ needs.metadata.outputs.commit }}

  packages:
    name: 构建 · ${{ matrix.platform }} ${{ matrix.arch }} 安装包
    needs: [metadata, plugin-tests]
    if: needs.metadata.outputs.operation == 'build'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: windows
            arch: amd64
            runner: windows-2022
          - platform: macos
            arch: arm64
            runner: macos-14
            electron_arch: arm64
            binary_arch: arm64
          - platform: macos
            arch: amd64
            runner: macos-15-intel
            electron_arch: x64
            binary_arch: x86_64
    steps:
      - name: 准备 · 获取固定源码
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
          submodules: recursive

      - name: 准备 · 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: 准备 · 固定 Harness 提交
        shell: bash
        run: |
          set -euo pipefail
          commit="$(node -p "require('./product.json').desktop.deepseekHarnessCommit")"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          git -C desktop/deepseek-harness fetch --no-tags --no-recurse-submodules origin "$commit"
          git -C desktop/deepseek-harness checkout --detach "$commit"
          git -C desktop/deepseek-harness submodule update --init --recursive

      - name: 准备 · 恢复构建缓存
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: |
            ~/.yarn/berry/cache
            ~/AppData/Local/Yarn/Berry/cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: desktop-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/pipeline/product.yarn.lock') }}

      - name: 构建 · Windows 检查与打包
        if: matrix.platform == 'windows'
        run: |
          corepack yarn test:uninstall
          corepack yarn product:dist:win

      - name: 检查 · Windows 文件占用升级恢复
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          function Invoke-Installer {
            param(
              [Parameter(Mandatory = $true)][string]$Path,
              [Parameter(Mandatory = $true)][string[]]$InstallerArguments
            )
            $process = Start-Process -FilePath $Path -ArgumentList $InstallerArguments -WindowStyle Hidden -PassThru
            try {
              Wait-Process -Id $process.Id -Timeout 300 -ErrorAction Stop
            } catch {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Windows installer did not finish within five minutes: $Path"
            }
            return $process.ExitCode
          }

          function Assert-InstalledVersion {
            param(
              [Parameter(Mandatory = $true)][string]$InstallDirectory,
              [Parameter(Mandatory = $true)][string]$ExpectedVersion,
              [Parameter(Mandatory = $true)][string]$ProductName
            )
            $executable = Join-Path $InstallDirectory "$ProductName.exe"
            if (-not (Test-Path -LiteralPath $executable)) {
              throw "Installed executable is missing: $executable"
            }
            $actualVersion = (Get-Item -LiteralPath $executable).VersionInfo.FileVersion
            if ($actualVersion -ne $ExpectedVersion) {
              throw "Installed version is $actualVersion, expected $ExpectedVersion"
            }
          }

          $currentVersion = "${{ needs.metadata.outputs.version }}"
          $currentInstallers = @(Get-ChildItem ".build/desktop/dsh-plugin-desktop/dist" -Filter "TokensCowork-*-x64-Setup.exe" -File -ErrorAction Stop)
          if ($currentInstallers.Count -ne 1) {
            throw "Expected exactly one current Windows installer, found $($currentInstallers.Count)"
          }

          $previousTag = (gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq ".tag_name").Trim()
          if ($previousTag -notmatch '^v(.+)$') {
            throw "Latest stable release has an invalid tag: $previousTag"
          }
          $previousVersion = $Matches[1]
          $previousPattern = "*-$previousVersion-windows-amd64-installer.exe"
          $previousDirectory = Join-Path $env:RUNNER_TEMP "TokensCowork-previous-stable"
          New-Item -ItemType Directory -Path $previousDirectory -Force | Out-Null
          gh release download $previousTag --repo $env:GITHUB_REPOSITORY --pattern $previousPattern --dir $previousDirectory
          $previousInstallers = @(Get-ChildItem -LiteralPath $previousDirectory -Filter "*-windows-amd64-installer.exe" -File)
          if ($previousInstallers.Count -ne 1) {
            throw "Expected exactly one previous Windows installer, found $($previousInstallers.Count)"
          }
          $previousInstaller = $previousInstallers[0].FullName
          $previousProductName = if ($previousInstallers[0].Name -like "TokensCowork-*") { "TokensCowork" } else { "TokensHarness" }

          $installDir = Join-Path $env:RUNNER_TEMP "TokensCowork-install-smoke"
          $installArguments = @("/S", "/currentuser", "/D=$installDir")
          $startedAt = Get-Date
          $previousExitCode = Invoke-Installer -Path $previousInstaller -InstallerArguments $installArguments
          if ($previousExitCode -ne 0) {
            throw "Previous stable installer failed with exit code $previousExitCode"
          }
          Assert-InstalledVersion -InstallDirectory $installDir -ExpectedVersion $previousVersion -ProductName $previousProductName

          # Reproduce the real failure mode: the old uninstaller cannot move one busy output file.
          # The current installer must stop without corrupting the old installation.
          $lockedFile = Join-Path $installDir "chrome_100_percent.pak"
          $lock = [System.IO.File]::Open($lockedFile, "Open", "Read", "None")
          try {
            $blockedExitCode = Invoke-Installer -Path $currentInstallers[0].FullName -InstallerArguments $installArguments
          } finally {
            $lock.Dispose()
          }
          if ($blockedExitCode -eq 0) {
            throw "Locked-file upgrade incorrectly reported success"
          }
          Assert-InstalledVersion -InstallDirectory $installDir -ExpectedVersion $previousVersion -ProductName $previousProductName

          # Once the file is released, the installer must automatically uninstall the old version
          # and complete the upgrade without requiring a manual directory cleanup.
          $upgradeExitCode = Invoke-Installer -Path $currentInstallers[0].FullName -InstallerArguments $installArguments
          if ($upgradeExitCode -ne 0) {
            throw "Windows upgrade smoke failed with exit code $upgradeExitCode"
          }
          Assert-InstalledVersion -InstallDirectory $installDir -ExpectedVersion $currentVersion -ProductName "TokensCowork"

          $elapsed = (Get-Date) - $startedAt
          $installedFiles = @(Get-ChildItem -LiteralPath $installDir -File -Recurse).Count
          Write-Host "Windows upgrade smoke: $previousVersion -> $currentVersion, $installedFiles files in $([math]::Round($elapsed.TotalSeconds, 1)) seconds"

      - name: 准备 · Windows 发布附件
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = "${{ needs.metadata.outputs.version }}"
          $dist = ".build/desktop/dsh-plugin-desktop/dist"
          $installers = @(Get-ChildItem -LiteralPath $dist -Filter "TokensCowork-*-x64-Setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)"
          }
          $releaseName = "TokensCowork-$version-windows-amd64-installer.exe"
          $releasePath = Join-Path $dist $releaseName
          Move-Item -LiteralPath $installers[0].FullName -Destination $releasePath
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $releasePath).Hash.ToLowerInvariant()
          "$hash  $releaseName" | Set-Content -Encoding ascii "$dist/TokensCowork-$version-windows-amd64-SHA256SUMS.txt"
          @(
            "version=$version"
            "git_sha=$env:GITHUB_SHA"
            "platform=windows"
            "architecture=amd64"
            "signing=unsigned"
          ) | Set-Content -Encoding ascii "$dist/TokensCowork-$version-windows-amd64-BUILD-INFO.txt"

      - name: 报告 · 保存 Windows 安装包
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-amd64-${{ needs.metadata.outputs.version }}
          path: |
            .build/desktop/dsh-plugin-desktop/dist/*-windows-amd64-installer.exe
            .build/desktop/dsh-plugin-desktop/dist/*-windows-amd64-SHA256SUMS.txt
            .build/desktop/dsh-plugin-desktop/dist/*-windows-amd64-BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: 准备 · 选择 macOS 签名方式
        if: matrix.platform == 'macos'
        id: signing
        shell: bash
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: printf 'mode=%s\n' "$(node build/modules/platform/mac-signing-resolve.mjs)" >> "${GITHUB_OUTPUT}"

      - name: 构建 · macOS 签名、公证与打包
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: DSH_MAC_ARCH="${{ matrix.electron_arch }}" corepack yarn product:dist:mac:auto

      - name: 报告 · 保存签名应用与公证编号
        if: always() && matrix.platform == 'macos' && steps.signing.outputs.mode == 'signed'
        uses: actions/upload-artifact@v7
        with:
          name: mac-notarization-${{ matrix.arch }}-${{ needs.metadata.outputs.version }}
          path: |
            .build/mac-recovery/${{ matrix.electron_arch }}/signed-app.zip
            .build/mac-recovery/${{ matrix.electron_arch }}/notarization.json
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

      - name: 检查 · macOS 安装包与发布附件
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.metadata.outputs.version }}"
          arch="${{ matrix.arch }}"
          signing="${{ steps.signing.outputs.mode }}"
          dist=".build/desktop/dsh-plugin-desktop/dist"
          packages=()
          while IFS= read -r -d '' package; do packages+=("${package}"); done < <(find "${dist}" -type f -name '*.dmg' -print0)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "Expected exactly one macOS DMG" >&2
            exit 1
          fi
          app_binary="$(find "${dist}" -type f -path '*/TokensCowork.app/Contents/MacOS/TokensCowork' -print -quit)"
          test -n "${app_binary}"
          app_path="${app_binary%/Contents/MacOS/TokensCowork}"
          lipo -archs "${app_binary}" | tr ' ' '\n' | grep -qx "${{ matrix.binary_arch }}"
          codesign --display --verbose=4 "${app_path}"
          codesign --verify --deep --strict --verbose=4 "${app_path}"
          if [[ "${signing}" == "signed" ]]; then
            spctl --assess --type execute --verbose=4 "${app_path}"
            xcrun stapler validate "${app_path}"
            signing="developer-id-notarized"
          else
            signing="ad-hoc"
          fi
          hdiutil verify "${packages[0]}"
          release_name="TokensCowork-${version}-macos-${arch}-installer.dmg"
          mv "${packages[0]}" "${dist}/${release_name}"
          (
            cd "${dist}"
            shasum -a 256 "${release_name}" > "TokensCowork-${version}-macos-${arch}-SHA256SUMS.txt"
          )
          {
            printf 'version=%s\n' "${version}"
            printf 'git_sha=%s\n' "${GITHUB_SHA}"
            printf 'platform=darwin\n'
            printf 'architecture=%s\n' "${arch}"
            printf 'signing=%s\n' "${signing}"
          } > "${dist}/TokensCowork-${version}-macos-${arch}-BUILD-INFO.txt"

      - name: 报告 · 保存 macOS 安装包
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-${{ matrix.arch }}-${{ needs.metadata.outputs.version }}
          path: |
            .build/desktop/dsh-plugin-desktop/dist/*-macos-${{ matrix.arch }}-installer.dmg
            .build/desktop/dsh-plugin-desktop/dist/*-macos-${{ matrix.arch }}-SHA256SUMS.txt
            .build/desktop/dsh-plugin-desktop/dist/*-macos-${{ matrix.arch }}-BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-release:
    name: 发布 · 预发布版本
    needs: [metadata, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - name: 准备 · 获取源码与标签
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0

      - name: 准备 · 获取三平台安装包
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*-${{ needs.metadata.outputs.version }}
          path: release-assets
          merge-multiple: true

      - name: 检查 · 核对或创建版本标签
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "RELEASE_TOKEN is required to publish as the designated GitHub account" >&2
            exit 1
          fi
          tag="${{ needs.metadata.outputs.tag }}"
          existing_sha="$(git rev-list -n 1 "${tag}^{commit}" 2>/dev/null || true)"
          if [[ -n "${existing_sha}" && "${existing_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Tag ${tag} points to ${existing_sha}, not ${GITHUB_SHA}" >&2
            exit 1
          fi
          if [[ -z "${existing_sha}" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" "${GITHUB_SHA}" -m "TokensCowork ${tag}"
            git push origin "refs/tags/${tag}"
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "GitHub Release ${tag} already exists" >&2
            exit 1
          fi

      # 插件清单资产：从本 tag 的 product.json 抽取默认启用插件的
      # 展示名、介绍、版本与仓库主页，供下载页渲染"内置插件"。
      - name: 准备 · 生成插件清单与发布正文
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.metadata.outputs.version }}"
          node scripts/generate-plugin-manifest.mjs > "release-assets/TokensCowork-${version}-plugins.json"
          node scripts/generate-plugin-manifest.mjs --release-notes "${{ needs.metadata.outputs.release_notes }}" > release-assets/release-notes.md
          cat "release-assets/TokensCowork-${version}-plugins.json"

      - name: 发布 · 校验附件并创建预发布
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.metadata.outputs.version }}"
          tag="${{ needs.metadata.outputs.tag }}"
          release_notes="release-assets/release-notes.md"
          packages=(
            "release-assets/TokensCowork-${version}-windows-amd64-installer.exe"
            "release-assets/TokensCowork-${version}-macos-arm64-installer.dmg"
            "release-assets/TokensCowork-${version}-macos-amd64-installer.dmg"
          )
          build_info=(
            "release-assets/TokensCowork-${version}-windows-amd64-BUILD-INFO.txt"
            "release-assets/TokensCowork-${version}-macos-arm64-BUILD-INFO.txt"
            "release-assets/TokensCowork-${version}-macos-amd64-BUILD-INFO.txt"
          )
          for asset in "${packages[@]}" "${build_info[@]}" "${release_notes}"; do
            test -f "${asset}"
          done
          checksums="release-assets/TokensCowork-${version}-SHA256SUMS.txt"
          (
            cd release-assets
            sha256sum \
              "$(basename "${packages[0]}")" \
              "$(basename "${packages[1]}")" \
              "$(basename "${packages[2]}")" \
              > "$(basename "${checksums}")"
          )
          release_flags=()
          if [[ "${{ needs.metadata.outputs.prerelease }}" == "true" ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${tag}" \
            "${packages[@]}" \
            "${checksums}" \
            "release-assets/TokensCowork-${version}-plugins.json" \
            "${release_flags[@]}" \
            --title "TokensCowork ${tag}" \
            --target "${GITHUB_SHA}" \
            --notes-file "${release_notes}"

  promote-release:
    name: 发布 · 转稳定版
    needs: [metadata, plugin-tests]
    if: needs.metadata.outputs.operation == 'promote'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_SOURCE_COMMIT: ${{ needs.metadata.outputs.commit }}
    steps:
      - name: 准备 · 获取源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 准备 · 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 发布 · 复核目标并晋级稳定版
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          corepack yarn product:release:promote "${RELEASE_TAG}" --apply

  summary:
    name: 报告 · 发布结果
    if: always()
    needs: [metadata, plugin-tests, packages, publish-release, promote-release]
    runs-on: ubuntu-24.04
    steps:
      - name: 报告 · 汇总发布结果
        shell: bash
        run: |
          {
            echo '## TokensCowork Desktop Build'
            echo
            echo '| Package | Result | Artifact |'
            echo '| --- | --- | --- |'
            echo '| Three platform packages | `${{ needs.packages.result }}` | `desktop-{windows-amd64,macos-arm64,macos-amd64}-${{ needs.metadata.outputs.version }}` |'
            echo '| Plugin regression | `${{ needs.plugin-tests.result }}` | 固定源码提交 `${{ needs.metadata.outputs.commit }}` |'
            echo '| Pre-release publication | `${{ needs.publish-release.result }}` | `${{ needs.metadata.outputs.tag }}` |'
            echo '| Stable promotion | `${{ needs.promote-release.result }}` | 复用已有安装包 |'
            echo
            echo 'If any package fails, remaining matrix jobs are cancelled and the release is not published.'
            echo
            echo 'macOS uses Developer ID signing and notarization when the complete secret set exists; otherwise it uses ad-hoc signing. BUILD-INFO files record the selected mode.'
          } >> "${GITHUB_STEP_SUMMARY}"
