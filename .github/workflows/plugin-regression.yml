name: Test Product Plugins

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Product tag or commit to test'
        required: true
        default: 'v0.5.19'
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  plugins:
    # 更新插件使用真实宿主平台选择安装包；产品支持 Windows/macOS。
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Set up pinned package manager
        run: npm install --global corepack@0.35.0 --force
      - name: Test pinned plugins
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_REF: ${{ inputs.ref }}
        run: node scripts/test-product-plugins.mjs --ref "$env:PRODUCT_REF"
      - name: Preserve plugin regression reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-regression-${{ github.run_id }}
          path: .build/plugin-tests/*/report.json
          if-no-files-found: ignore
