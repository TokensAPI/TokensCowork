name: 测试 · 内置插件功能

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '产品 tag 或提交；留空测试本次运行的提交'
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

# 独立运行与发布调用共用回归锁；不同于发布锁，避免调用者自锁。
concurrency:
  group: product-plugin-regression
  cancel-in-progress: false

jobs:
  plugins:
    name: 检查 · 内置插件回归
    # 更新插件使用真实宿主平台选择安装包；产品支持 Windows/macOS。
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: 准备 · 获取源码
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive
      - name: 准备 · 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: 准备 · 配置固定包管理器
        run: npm install --global corepack@0.35.0 --force
      - name: 检查 · 固定内置插件
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_REF: ${{ inputs.ref || github.sha }}
        run: corepack yarn test:plugins --ref "$env:PRODUCT_REF"
      - name: 报告 · 保存插件回归结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-regression-${{ github.run_id }}
          path: .build/plugin-tests/*/report.json
          if-no-files-found: ignore
