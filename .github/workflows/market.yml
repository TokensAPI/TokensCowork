name: Deploy Plugin Market

on:
  push:
    branches:
      - master
    paths:
      - "market/**"
      - ".github/workflows/market.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-market
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Deploy market directory
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy market --project-name tokenscowork-market --branch master

      - name: Verify deployment
        run: |
          sleep 15
          for path in /source.json /roster.json /v1/plugins /admin/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://tokenscowork-market.pages.dev${path}")
            echo "${path} -> ${code}"
            [ "${code}" = "200" ] || exit 1
          done
          curl -s "https://tokenscowork-market.pages.dev/v1/plugins" | jq -e '.schemaVersion == "1.0.0" and (.items | length) > 0' > /dev/null
          echo "catalog schema ok"
