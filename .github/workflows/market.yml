name: Deploy Plugin Market

on:
  push:
    branches:
      - master
    paths:
      - "market/**"
      - "scripts/generate-market-catalog.mjs"
      - "build/verify/verify-market-catalog.mjs"
      - ".github/workflows/market.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-market
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # roster.json 是插件目录的唯一源数据。先校验名册和产品约束，
      # 再为本次部署生成不纳入 Git 的静态故障兜底。
      - name: Verify market data
        run: node build/verify/verify-market-catalog.mjs

      - name: Generate market deployment artifacts
        run: node scripts/generate-market-catalog.mjs

      - name: Test market authorization
        run: node --test market/tests/access.test.mjs

      # 直接 npx 调用 wrangler:仓库根 package.json 声明 yarn@4 的
      # packageManager,wrangler-action 的 yarn 安装路径会被 corepack
      # 拦下,npx 则不受包管理器声明影响。
      - name: Deploy market directory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 execute tokenscowork-market-access --remote --file market/scripts/organization-schema.sql
          npx --yes wrangler@4 pages deploy market --project-name tokenscowork-market --branch master

      - name: Verify deployment
        run: |
          sleep 15
          for path in /source.json /roster.json /v1/plugins /admin/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://tokenscowork-market.pages.dev${path}")
            echo "${path} -> ${code}"
            [ "${code}" = "200" ] || exit 1
          done
          curl -s "https://tokenscowork-market.pages.dev/v1/plugins" | jq -e '.schemaVersion == "1.0.0" and (.items | length) > 0' > /dev/null
          echo "catalog schema ok"
