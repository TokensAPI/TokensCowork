name: Deploy Plugin Market

on:
  push:
    branches:
      - master
    paths:
      - "market/**"
      - ".github/workflows/market.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-market
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 直接 npx 调用 wrangler:仓库根 package.json 声明 yarn@4 的
      # packageManager,wrangler-action 的 yarn 安装路径会被 corepack
      # 拦下,npx 则不受包管理器声明影响。
      - name: Deploy market directory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy market --project-name tokenscowork-market --branch master

      - name: Verify deployment
        run: |
          sleep 15
          for path in /source.json /roster.json /v1/plugins /admin/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://tokenscowork-market.pages.dev${path}")
            echo "${path} -> ${code}"
            [ "${code}" = "200" ] || exit 1
          done
          curl -s "https://tokenscowork-market.pages.dev/v1/plugins" | jq -e '.schemaVersion == "1.0.0" and (.items | length) > 0' > /dev/null
          echo "catalog schema ok"
