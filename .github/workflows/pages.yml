name: Deploy Download Page

on:
  push:
    branches:
      - master
    paths:
      - "download/**"
      - ".github/workflows/pages.yml"
  release:
    types:
      - published
      - released
      - prereleased
      - edited
      - deleted
  workflow_run:
    workflows:
      - Build Desktop
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .pages
          cp -R download/. .pages/
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq 'add' > .pages/releases.json

      - name: Upload download page
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
