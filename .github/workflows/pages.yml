name: Deploy Download Page

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - master
    paths:
      - "download/**"
      - ".github/workflows/pages.yml"
  release:
    types:
      - published
      - released
      - prereleased
      - edited
      - deleted
  workflow_run:
    workflows:
      - Build Desktop
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  check:
    name: Check Release Metadata
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.metadata.outputs.deploy }}

    steps:
      - name: Compare release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          next_releases="$(mktemp)"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq 'add' > "${next_releases}"

          deploy=true
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            current_releases="$(mktemp)"
            current_signature="$(mktemp)"
            next_signature="$(mktemp)"
            signature='map({
              id,
              tag_name,
              name,
              draft,
              prerelease,
              created_at,
              updated_at,
              published_at,
              body,
              assets: ((.assets // []) | map({
                id,
                name,
                label,
                state,
                content_type,
                size,
                digest,
                created_at,
                updated_at,
                browser_download_url
              }))
            })'
            pages_owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
            pages_repo="${GITHUB_REPOSITORY#*/}"
            pages_url="https://${pages_owner}.github.io/${pages_repo}/releases.json?run=${GITHUB_RUN_ID}"

            if curl --fail --silent --show-error --location \
              --header "Cache-Control: no-cache" \
              "${pages_url}" > "${current_releases}" \
              && jq -S "${signature}" "${current_releases}" > "${current_signature}" \
              && jq -S "${signature}" "${next_releases}" > "${next_signature}" \
              && cmp --silent "${current_signature}" "${next_signature}"; then
              deploy=false
            fi
          fi
          echo "deploy=${deploy}" >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy GitHub Pages
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Prepare download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .pages
          cp -R download/. .pages/
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq 'add' > .pages/releases.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload download page
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
