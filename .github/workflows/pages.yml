name: Deploy Download Page

on:
  push:
    branches:
      - master
    paths:
      - "download/**"
      - ".github/workflows/pages.yml"
  release:
    types:
      - published
  workflow_run:
    workflows:
      - Build Desktop
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Mark preview releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/373249169" -F prerelease=true > /dev/null
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/373458905" -F prerelease=true > /dev/null

      - name: Prepare download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .pages
          cp -R download/. .pages/
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > .pages/releases.json

      - name: Upload download page
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
