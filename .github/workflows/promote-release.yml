name: Promote Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing pre-release tag to promote (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-promotion
  cancel-in-progress: false

jobs:
  plugin-tests:
    uses: ./.github/workflows/plugin-regression.yml
    with:
      ref: ${{ inputs.tag }}
  promote:
    needs: plugin-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate and promote existing installers
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          node --test scripts/validate-release-notes.test.mjs scripts/release-notes-display.test.mjs scripts/promote-release.test.mjs
          node scripts/promote-release.mjs "${RELEASE_TAG}" --apply
