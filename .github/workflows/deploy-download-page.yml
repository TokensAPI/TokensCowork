name: 部署 · 下载页

on:
  push:
    branches:
      - master
    paths:
      - "download/**"
      - ".github/workflows/deploy-download-page.yml"
  workflow_run:
    workflows:
      - 发布 · 桌面应用
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 部署 · 下载页
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 准备 · 获取源码
        uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false

      - name: 准备 · 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 准备 · 生成下载页数据
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          corepack yarn test:release:display
          mkdir -p .pages
          cp -R download/. .pages/
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq 'add' > .pages/releases.json
          # Release 资产域不带 CORS 头，浏览器无法跨域读取插件清单；
          # 部署时将各版本的 plugins.json 复制进站点，页面走同源请求。
          mkdir -p .pages/plugins
          jq -r '.[] | .tag_name as $tag | .assets[] | select(.name | endswith("-plugins.json")) | "\($tag) \(.url)"' .pages/releases.json \
            | while read -r tag asset_url; do
                gh api "${asset_url#https://api.github.com/}" -H "Accept: application/octet-stream" > ".pages/plugins/${tag}.json" || rm -f ".pages/plugins/${tag}.json"
              done
          ls .pages/plugins/

      - name: 准备 · 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 准备 · 上传下载页
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

      - name: 部署 · 下载页
        id: deployment
        uses: actions/deploy-pages@v4
