name: 部署 · 插件市场

on:
  push:
    branches: [master]
    paths:
      - 'market/server/**'
      - 'market/deploy/**'
      - 'product.json'
      - 'scripts/generate-market-catalog.mjs'
      - 'build/modules/market/market-catalog-verify.mjs'
      - '.github/workflows/deploy-plugin-market.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-server-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: ${{ vars.MARKET_SSH_HOST || '5.223.77.54' }}
  DEPLOY_PORT: ${{ vars.MARKET_SSH_PORT || '22' }}
  DEPLOY_USER: ${{ vars.MARKET_SSH_USER || 'wsy' }}
  DEPLOY_PATH: ${{ vars.MARKET_DEPLOY_PATH || '/home/wsy/TokensCowork' }}

jobs:
  test:
    name: 检查 · 市场服务与部署脚本
    runs-on: ubuntu-24.04
    steps:
      - name: 准备 · 获取源码
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 准备 · 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: market/server/admin-web/package-lock.json
      # The console (/admin/): locked dependencies, no install scripts; type check, tests and
      # build must all pass before anything deploys. The build is then served to the market tests below.
      - name: 准备 · 安装后台前端依赖
        run: npm --prefix market/server/admin-web ci --ignore-scripts --no-audit --no-fund
      - name: 检查 · 后台前端类型
        run: npm --prefix market/server/admin-web run typecheck
      - name: 检查 · 后台前端测试
        run: npm --prefix market/server/admin-web test
      - name: 构建 · 后台前端
        run: npm --prefix market/server/admin-web run build
      - name: 检查 · 市场服务与部署脚本
        run: corepack yarn test:market
      - name: 检查 · 部署脚本语法
        run: bash -n market/deploy/deploy.sh
      # The image the server will build, built here first from the same Dockerfile: stage 1 runs on
      # Alpine and installs the console's native build binaries (musl), so a problem there shows up
      # in CI, not on deploy. It must build, carry admin/console/, start, and serve the console at
      # /admin/ with its entry script, the docs center at /docs and the API reference. Built only, never pushed; the server still builds its own image on deploy.
      - name: 检查 · 市场镜像构建与启动
        shell: bash
        run: |
          set -euo pipefail
          image="tokenscowork-market-ci:$GITHUB_SHA"
          docker build --pull -t "$image" market/server
          docker run --rm --entrypoint sh "$image" -c 'test -s admin/console/index.html && test ! -e admin-web'
          # A placeholder origin: the container only answers loopback requests here and contacts nothing.
          container=$(docker run -d -e MARKET_HOST_PUBLIC_ORIGIN=https://market.example -p 127.0.0.1:18080:8080 "$image")
          trap 'docker logs "$container" || true; docker rm -f "$container" > /dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:18080/admin/ ; then break; fi
            if [[ $(docker inspect --format '{{.State.Running}}' "$container") != true ]]; then
              echo '::error::The market container exited before serving /admin/.'
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:18080/admin/ -o "$RUNNER_TEMP/admin.html"
          entry=$(grep -o '/admin/console/assets/index-[A-Za-z0-9_-]*\.js' "$RUNNER_TEMP/admin.html" | head -n 1)
          if [[ -z "$entry" ]]; then
            echo '::error::/admin/ does not load the console entry script.'
            exit 1
          fi
          curl --fail --silent --show-error "http://127.0.0.1:18080$entry" -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/docs -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/admin/api-docs.html -o /dev/null
          echo "Market image built and served /admin/ ($entry), /docs and the API reference" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: 部署 · 市场服务
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 准备 · 获取源码
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 检查 · 市场部署配置
        env:
          DEPLOY_KEY: ${{ secrets.MARKET_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.MARKET_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_PATH" || -z "$DEPLOY_KEY" || -z "$KNOWN_HOSTS" || -z "$DEPLOY_HOST" || -z "$DEPLOY_USER" ]]; then
            echo '::error::Market server deployment is not configured. See market/deploy/README.md; no deployment occurred.'
            exit 1
          fi
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "${DEPLOY_PORT:-22}" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ && "$DEPLOY_PATH" != / ]]
          mkdir -p "$RUNNER_TEMP/market-ssh"
          chmod 700 "$RUNNER_TEMP/market-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/market-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/market-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/market-ssh/"*
      - name: 部署 · 已通过测试的市场提交
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/market-ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -i "$RUNNER_TEMP/market-ssh/key" -p "${DEPLOY_PORT:-22}" \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$GITHUB_SHA' '$DEPLOY_PATH'" < market/deploy/deploy.sh
      - name: 检查 · 线上管理页面
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --max-time 30 https://market.tokensapi.ai/admin/ -o /dev/null
          curl --fail --silent --show-error --retry 3 --max-time 30 https://market.tokensapi.ai/docs -o /dev/null
          curl --fail --silent --show-error --retry 3 --max-time 30 https://market.tokensapi.ai/admin/api-docs.html -o /dev/null
          echo "Market server deployed commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: 清理 · 删除临时 SSH 凭据
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/market-ssh/key" "$RUNNER_TEMP/market-ssh/known_hosts"
