name: 查询/恢复 · macOS 公证

on:
  workflow_dispatch:
    inputs:
      operation:
        description: '操作：inspect 查询；resume 恢复原公证与安装包'
        required: true
        default: inspect
        type: choice
        options: [inspect, resume]
      source_run_id:
        description: 恢复时填写原产品发布运行 ID；查询时留空
        required: false
        type: string
      architecture:
        description: '恢复架构；查询状态时忽略，不重新编译或提交公证'
        required: true
        default: both
        type: choice
        options: [both, arm64, amd64]

permissions:
  contents: read
  actions: read

concurrency:
  group: macos-notarization-${{ inputs.operation }}-${{ inputs.source_run_id || 'history' }}
  cancel-in-progress: false

jobs:
  inspect:
    name: 查询 · Apple 公证状态
    if: inputs.operation == 'inspect'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: 准备 · 获取源码
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 准备 · 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: 查询 · 最近公证提交
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node build/modules/platform/mac-notarization.mjs history
  source:
    name: 准备 · 核对原运行及保存产物
    if: inputs.operation == 'resume'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      matrix: ${{ steps.source.outputs.matrix }}
    steps:
      - name: 准备 · 获取源码
        uses: actions/checkout@v7
      - name: 准备 · 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: 检查 · 原运行与可恢复产物
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          TARGET_ARCHITECTURE: ${{ inputs.architecture }}
        run: node build/modules/platform/mac-notarization.mjs source "$SOURCE_RUN_ID" "$TARGET_ARCHITECTURE"

  recover:
    name: 恢复 · macOS ${{ matrix.arch }} 安装包
    needs: source
    timeout-minutes: 40
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    steps:
      - name: 准备 · 获取源码
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: 准备 · 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: 准备 · 获取保存产物
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          name: mac-notarization-${{ matrix.arch }}-${{ needs.source.outputs.version }}
          path: recovery
      - name: 恢复 · 等待原公证并生成安装包
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          TARGET_ARCH: ${{ matrix.electron_arch }}
        run: node build/modules/platform/mac-notarization.mjs resume recovery product.json "$SOURCE_COMMIT" "$TARGET_ARCH"
      - name: 报告 · 保存构建产物
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-${{ matrix.arch }}-${{ needs.source.outputs.version }}
          path: |
            recovery/*-installer.dmg
            recovery/*-SHA256SUMS.txt
            recovery/*-BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
