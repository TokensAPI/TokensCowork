# 插件上架体检:后台管理员在 Actions 页手动填「包名@版本」触发,
# 体检报告写进本次运行的 Summary。上架时把本次运行的链接填入
# 后台 publish 对话框的「检查记录链接」,即完成"过检才能上架"闭环
# (链接本身的红/绿就是证据,reviewed_version 由 publish 落库)。
name: Plugin Check

on:
  workflow_dispatch:
    inputs:
      package:
        description: "npm 包(建议锁定精确版本,如 @tokensapi/dsh-progressive-tools@0.2.0)"
        required: true
        type: string
      runtime:
        description: "目标 DSH 运行时版本"
        required: true
        default: "0.1.3-alpha.1"
        type: string

permissions:
  contents: read

jobs:
  check:
    name: 体检 ${{ inputs.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run dsh-plugin-check
        id: check
        shell: bash
        run: |
          set -o pipefail
          status=0
          npx -y @tokensapi/dsh-plugin-check@latest \
            --package "${{ inputs.package }}" \
            --runtime "${{ inputs.runtime }}" \
            --json > report.json || status=$?
          cat report.json
          echo "status=${status}" >> "${GITHUB_OUTPUT}"

      - name: Render summary
        shell: bash
        run: |
          node - <<'EOF' >> "${GITHUB_STEP_SUMMARY}"
          const report = JSON.parse(require('node:fs').readFileSync('report.json', 'utf8'))
          const line = (finding, mark) => `| ${mark} | ${finding.rule} | ${finding.message.replaceAll('|', '\\|')} |`
          console.log(`# ${report.ok ? '✅ 合格' : '❌ 不合格'} · ${report.plugin}@${report.version}`)
          console.log(`目标运行时:\`${report.runtime}\``)
          console.log('')
          console.log('| 结果 | 规则 | 说明 |')
          console.log('| --- | --- | --- |')
          for (const finding of report.errors) console.log(line(finding, '❌'))
          for (const finding of report.warnings) console.log(line(finding, '⚠️'))
          if (report.errors.length === 0 && report.warnings.length === 0) console.log('| ✅ | - | 全部规则通过 |')
          console.log('')
          console.log(report.ok
            ? '> 上架时把本次运行的链接填入后台「检查记录链接」。'
            : '> 存在 error,不满足上架条件;修复后重新发布版本并重跑体检。')
          EOF

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: plugin-check-report
          path: report.json

      - name: Enforce verdict
        shell: bash
        run: exit "${{ steps.check.outputs.status }}"
