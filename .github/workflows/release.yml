name: Build Desktop

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Publish as a GitHub Pre-release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: "1"

jobs:
  metadata:
    name: Resolve VERSION
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_notes: ${{ steps.version.outputs.release_notes }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate canonical version and release notes
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(bash scripts/set-version.sh --print)"
          tag="v${version}"
          release_notes="docs/releases/v${version}.md"
          bash scripts/set-version.sh --check
          node scripts/validate-release-notes.mjs --version "${version}" --file "${release_notes}"
          node --test scripts/validate-release-notes.test.mjs
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match VERSION=${version}" >&2
            exit 1
          fi
          existing_sha="$(git rev-list -n 1 "${tag}^{commit}" 2>/dev/null || true)"
          if [[ -n "${existing_sha}" && "${existing_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Tag ${tag} is already occupied by ${existing_sha}" >&2
            exit 1
          fi
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"
          printf 'release_notes=%s\n' "${release_notes}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.prerelease }}" == "true" ]]; then
            printf 'prerelease=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'prerelease=false\n' >> "${GITHUB_OUTPUT}"
          fi

  windows-amd64:
    name: Verify product and build Windows amd64 installer
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out all pinned sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Restore build caches
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: |
            ~/.yarn/berry/cache
            ~/AppData/Local/Yarn/Berry/cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: desktop-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/product.yarn.lock') }}

      - name: Run complete product gates and build unsigned Windows installer
        run: corepack yarn product:dist:win

      - name: Smoke test Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem ".build/desktop/dsh-plugin-desktop/dist" -Filter "TokensHarness-*-x64-Setup.exe" -File -ErrorAction Stop
          $installDir = Join-Path $env:RUNNER_TEMP "TokensHarness-install-smoke"
          $startedAt = Get-Date
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/currentuser", "/D=$installDir" -WindowStyle Hidden -PassThru
          try {
            Wait-Process -Id $process.Id -Timeout 300 -ErrorAction Stop
          } catch {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Windows installer did not finish within five minutes"
          }
          if ($process.ExitCode -ne 0 -or -not (Test-Path "$installDir/TokensHarness.exe")) {
            throw "Windows installer smoke test failed with exit code $($process.ExitCode)"
          }
          $elapsed = (Get-Date) - $startedAt
          $installedFiles = @(Get-ChildItem -LiteralPath $installDir -File -Recurse).Count
          Write-Host "Windows installer smoke: $installedFiles files in $([math]::Round($elapsed.TotalSeconds, 1)) seconds"

      - name: Prepare Windows release files
        shell: pwsh
        run: |
          $version = "${{ needs.metadata.outputs.version }}"
          $dist = ".build/desktop/dsh-plugin-desktop/dist"
          $installers = @(Get-ChildItem -LiteralPath $dist -Filter "TokensHarness-*-x64-Setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)"
          }
          $releaseName = "TokensHarness-$version-windows-amd64-installer.exe"
          $releasePath = Join-Path $dist $releaseName
          Move-Item -LiteralPath $installers[0].FullName -Destination $releasePath
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $releasePath).Hash.ToLowerInvariant()
          "$hash  $releaseName" | Set-Content -Encoding ascii "$dist/TokensHarness-$version-windows-amd64-SHA256SUMS.txt"
          @(
            "version=$version"
            "git_sha=$env:GITHUB_SHA"
            "platform=windows"
            "architecture=amd64"
            "signing=unsigned"
          ) | Set-Content -Encoding ascii "$dist/TokensHarness-$version-windows-amd64-BUILD-INFO.txt"

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-amd64-${{ needs.metadata.outputs.version }}
          path: |
            .build/desktop/dsh-plugin-desktop/dist/*-windows-amd64-installer.exe
            .build/desktop/dsh-plugin-desktop/dist/*-windows-amd64-SHA256SUMS.txt
            .build/desktop/dsh-plugin-desktop/dist/*-windows-amd64-BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  macos:
    name: Build macOS ${{ matrix.arch }} DMG
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            electron_arch: arm64
            binary_arch: arm64
          - arch: amd64
            runner: macos-15-intel
            electron_arch: x64
            binary_arch: x86_64
    steps:
      - name: Check out all pinned sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Restore build caches
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: |
            ~/.yarn/berry/cache
            ~/AppData/Local/Yarn/Berry/cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: desktop-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/product.yarn.lock') }}

      - name: Select macOS signing mode
        id: signing
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: printf 'mode=%s\n' "$(node build/macos/signing-mode.mjs)" >> "${GITHUB_OUTPUT}"

      - name: Build macOS DMG
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: DSH_MAC_ARCH="${{ matrix.electron_arch }}" corepack yarn product:dist:mac:auto

      - name: Verify and prepare macOS release files
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.metadata.outputs.version }}"
          arch="${{ matrix.arch }}"
          signing="${{ steps.signing.outputs.mode }}"
          dist=".build/desktop/dsh-plugin-desktop/dist"
          packages=("${dist}"/*.dmg)
          if [[ ! -e "${packages[0]}" || "${#packages[@]}" -ne 1 ]]; then
            echo "Expected exactly one macOS DMG" >&2
            exit 1
          fi
          app_binary="$(find "${dist}" -type f -path '*/TokensHarness.app/Contents/MacOS/TokensHarness' -print -quit)"
          test -n "${app_binary}"
          app_path="${app_binary%/Contents/MacOS/TokensHarness}"
          lipo -archs "${app_binary}" | tr ' ' '\n' | grep -qx "${{ matrix.binary_arch }}"
          codesign --display --verbose=4 "${app_path}"
          codesign --verify --deep --strict --verbose=4 "${app_path}"
          if [[ "${signing}" == "signed" ]]; then
            spctl --assess --type execute --verbose=4 "${app_path}"
            xcrun stapler validate "${app_path}"
            signing="developer-id-notarized"
          else
            signing="ad-hoc"
          fi
          hdiutil verify "${packages[0]}"
          release_name="TokensHarness-${version}-macos-${arch}-installer.dmg"
          mv "${packages[0]}" "${dist}/${release_name}"
          (
            cd "${dist}"
            shasum -a 256 "${release_name}" > "TokensHarness-${version}-macos-${arch}-SHA256SUMS.txt"
          )
          {
            printf 'version=%s\n' "${version}"
            printf 'git_sha=%s\n' "${GITHUB_SHA}"
            printf 'platform=darwin\n'
            printf 'architecture=%s\n' "${arch}"
            printf 'signing=%s\n' "${signing}"
          } > "${dist}/TokensHarness-${version}-macos-${arch}-BUILD-INFO.txt"

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-${{ matrix.arch }}-${{ needs.metadata.outputs.version }}
          path: |
            .build/desktop/dsh-plugin-desktop/dist/*-macos-${{ matrix.arch }}-installer.dmg
            .build/desktop/dsh-plugin-desktop/dist/*-macos-${{ matrix.arch }}-SHA256SUMS.txt
            .build/desktop/dsh-plugin-desktop/dist/*-macos-${{ matrix.arch }}-BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-release:
    name: Publish GitHub Release
    needs: [metadata, windows-amd64, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download desktop packages
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*-${{ needs.metadata.outputs.version }}
          path: release-assets
          merge-multiple: true

      - name: Validate or create VERSION tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "RELEASE_TOKEN is required to publish as the designated GitHub account" >&2
            exit 1
          fi
          tag="${{ needs.metadata.outputs.tag }}"
          existing_sha="$(git rev-list -n 1 "${tag}^{commit}" 2>/dev/null || true)"
          if [[ -n "${existing_sha}" && "${existing_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Tag ${tag} points to ${existing_sha}, not ${GITHUB_SHA}" >&2
            exit 1
          fi
          if [[ -z "${existing_sha}" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" "${GITHUB_SHA}" -m "TokensHarness ${tag}"
            git push origin "refs/tags/${tag}"
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "GitHub Release ${tag} already exists" >&2
            exit 1
          fi

      # 插件清单资产：从本 tag 的 product.json 抽取默认启用插件的
      # 展示名、介绍、版本与仓库主页，供下载页渲染"内置插件"。
      - name: Generate bundled plugin manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.metadata.outputs.version }}"
          node scripts/generate-plugin-manifest.mjs > "release-assets/TokensHarness-${version}-plugins.json"
          cat "release-assets/TokensHarness-${version}-plugins.json"

      - name: Create checksums and GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.metadata.outputs.version }}"
          tag="${{ needs.metadata.outputs.tag }}"
          release_notes="${{ needs.metadata.outputs.release_notes }}"
          packages=(
            "release-assets/TokensHarness-${version}-windows-amd64-installer.exe"
            "release-assets/TokensHarness-${version}-macos-arm64-installer.dmg"
            "release-assets/TokensHarness-${version}-macos-amd64-installer.dmg"
          )
          build_info=(
            "release-assets/TokensHarness-${version}-windows-amd64-BUILD-INFO.txt"
            "release-assets/TokensHarness-${version}-macos-arm64-BUILD-INFO.txt"
            "release-assets/TokensHarness-${version}-macos-amd64-BUILD-INFO.txt"
          )
          for asset in "${packages[@]}" "${build_info[@]}" "${release_notes}"; do
            test -f "${asset}"
          done
          checksums="release-assets/TokensHarness-${version}-SHA256SUMS.txt"
          (
            cd release-assets
            sha256sum \
              "$(basename "${packages[0]}")" \
              "$(basename "${packages[1]}")" \
              "$(basename "${packages[2]}")" \
              > "$(basename "${checksums}")"
          )
          release_flags=()
          if [[ "${{ needs.metadata.outputs.prerelease }}" == "true" ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${tag}" \
            "${packages[@]}" \
            "${checksums}" \
            "release-assets/TokensHarness-${version}-plugins.json" \
            "${release_flags[@]}" \
            --title "TokensHarness ${tag}" \
            --target "${GITHUB_SHA}" \
            --notes-file "${release_notes}"

  summary:
    name: Publish build summary
    if: always()
    needs: [metadata, windows-amd64, macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Write job summary
        shell: bash
        run: |
          {
            echo '## TokensHarness Desktop Build'
            echo
            echo '| Package | Result | Artifact |'
            echo '| --- | --- | --- |'
            echo '| Product quality + Windows amd64 | `${{ needs.windows-amd64.result }}` | `desktop-windows-amd64-${{ needs.metadata.outputs.version }}` |'
            echo '| macOS arm64 + amd64 | `${{ needs.macos.result }}` | `desktop-macos-{arm64,amd64}-${{ needs.metadata.outputs.version }}` |'
            echo
            echo 'macOS uses Developer ID signing and notarization when the complete secret set exists; otherwise it uses ad-hoc signing. BUILD-INFO files record the selected mode.'
          } >> "${GITHUB_STEP_SUMMARY}"
