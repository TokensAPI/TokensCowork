name: Desktop Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create a GitHub Release after all desktop packages pass
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: "1"

jobs:
  metadata:
    name: Resolve product version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out superproject
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate product version and tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" || "${{ inputs.publish_release }}" == "true" ]]; then
            existing_sha="$(git rev-list -n 1 "${tag}^{commit}" 2>/dev/null || true)"
            if [[ -n "${existing_sha}" && "${existing_sha}" != "${GITHUB_SHA}" ]]; then
              echo "Tag ${tag} is already occupied by ${existing_sha}" >&2
              exit 1
            fi
          fi
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"

  verify:
    name: Verify pinned product layout
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out all pinned sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Verify superproject pins
        run: corepack yarn product:check

  windows-amd64:
    name: Build Windows amd64 installer
    needs: [metadata, verify]
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out all pinned sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Build unsigned Windows installer
        run: corepack yarn product:dist:win

      - name: Prepare Windows release files
        shell: pwsh
        run: |
          $version = "${{ needs.metadata.outputs.version }}"
          $dist = ".build/desktop/dsh-plugin-desktop/dist"
          $installers = @(Get-ChildItem -LiteralPath $dist -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)"
          }
          $releaseName = "DSH-Desktop-$version-windows-amd64-installer.exe"
          $releasePath = Join-Path $dist $releaseName
          Move-Item -LiteralPath $installers[0].FullName -Destination $releasePath
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $releasePath).Hash.ToLowerInvariant()
          "$hash  $releaseName" | Set-Content -Encoding ascii "$dist/DSH-Desktop-$version-windows-amd64-SHA256SUMS.txt"
          @(
            "version=$version"
            "git_sha=$env:GITHUB_SHA"
            "platform=windows"
            "architecture=amd64"
            "signing=unsigned"
          ) | Set-Content -Encoding ascii "$dist/DSH-Desktop-$version-windows-amd64-BUILD-INFO.txt"

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-amd64-${{ needs.metadata.outputs.version }}
          path: |
            .build/desktop/dsh-plugin-desktop/dist/*-windows-amd64-installer.exe
            .build/desktop/dsh-plugin-desktop/dist/*-windows-amd64-SHA256SUMS.txt
            .build/desktop/dsh-plugin-desktop/dist/*-windows-amd64-BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  macos-arm64:
    name: Build macOS arm64 DMG
    needs: [metadata, verify]
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Check out all pinned sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Build unsigned macOS DMG
        run: corepack yarn product:dist:mac-unsigned

      - name: Prepare macOS release files
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.metadata.outputs.version }}"
          dist=".build/desktop/dsh-plugin-desktop/dist"
          packages=("${dist}"/*.dmg)
          if [[ ! -e "${packages[0]}" || "${#packages[@]}" -ne 1 ]]; then
            echo "Expected exactly one macOS DMG" >&2
            exit 1
          fi
          release_name="DSH-Desktop-${version}-macos-arm64-installer.dmg"
          mv "${packages[0]}" "${dist}/${release_name}"
          (
            cd "${dist}"
            shasum -a 256 "${release_name}" > "DSH-Desktop-${version}-macos-arm64-SHA256SUMS.txt"
          )
          {
            printf 'version=%s\n' "${version}"
            printf 'git_sha=%s\n' "${GITHUB_SHA}"
            printf 'platform=darwin\n'
            printf 'architecture=arm64\n'
            printf 'signing=unsigned\n'
          } > "${dist}/DSH-Desktop-${version}-macos-arm64-BUILD-INFO.txt"

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-arm64-${{ needs.metadata.outputs.version }}
          path: |
            .build/desktop/dsh-plugin-desktop/dist/*-macos-arm64-installer.dmg
            .build/desktop/dsh-plugin-desktop/dist/*-macos-arm64-SHA256SUMS.txt
            .build/desktop/dsh-plugin-desktop/dist/*-macos-arm64-BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' || inputs.publish_release == true
    needs: [metadata, windows-amd64, macos-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download desktop packages
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*-${{ needs.metadata.outputs.version }}
          path: release-assets
          merge-multiple: true

      - name: Validate or create product tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.metadata.outputs.tag }}"
          existing_sha="$(git rev-list -n 1 "${tag}^{commit}" 2>/dev/null || true)"
          if [[ -n "${existing_sha}" && "${existing_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Tag ${tag} points to ${existing_sha}, not ${GITHUB_SHA}" >&2
            exit 1
          fi
          if [[ -z "${existing_sha}" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" "${GITHUB_SHA}" -m "TokensHarness ${tag}"
            git push origin "refs/tags/${tag}"
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "GitHub Release ${tag} already exists" >&2
            exit 1
          fi

      - name: Create GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.metadata.outputs.version }}"
          tag="${{ needs.metadata.outputs.tag }}"
          packages=(
            "release-assets/DSH-Desktop-${version}-windows-amd64-installer.exe"
            "release-assets/DSH-Desktop-${version}-macos-arm64-installer.dmg"
          )
          build_info=(
            "release-assets/DSH-Desktop-${version}-windows-amd64-BUILD-INFO.txt"
            "release-assets/DSH-Desktop-${version}-macos-arm64-BUILD-INFO.txt"
          )
          for asset in "${packages[@]}" "${build_info[@]}"; do
            test -f "${asset}"
          done
          checksums="release-assets/DSH-Desktop-${version}-SHA256SUMS.txt"
          (
            cd release-assets
            sha256sum \
              "$(basename "${packages[0]}")" \
              "$(basename "${packages[1]}")" \
              > "$(basename "${checksums}")"
          )
          gh release create "${tag}" \
            "${packages[@]}" \
            "${build_info[@]}" \
            "${checksums}" \
            --title "TokensHarness ${tag}" \
            --target "${GITHUB_SHA}" \
            --generate-notes

  summary:
    name: Publish build summary
    if: always()
    needs: [metadata, verify, windows-amd64, macos-arm64]
    runs-on: ubuntu-24.04
    steps:
      - name: Write job summary
        shell: bash
        run: |
          {
            echo '## TokensHarness Desktop Build'
            echo
            echo '| Package | Result | Artifact |'
            echo '| --- | --- | --- |'
            echo '| Product layout | `${{ needs.verify.result }}` | — |'
            echo '| Windows amd64 | `${{ needs.windows-amd64.result }}` | `desktop-windows-amd64-${{ needs.metadata.outputs.version }}` |'
            echo '| macOS arm64 | `${{ needs.macos-arm64.result }}` | `desktop-macos-arm64-${{ needs.metadata.outputs.version }}` |'
            echo
            echo 'Installers in this build are unsigned.'
          } >> "${GITHUB_STEP_SUMMARY}"
