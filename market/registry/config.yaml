# TokensCowork npm Registry.
# Nginx should proxy to http://127.0.0.1:4873.
storage: /verdaccio/storage
plugins: /verdaccio/plugins

web:
  enable: true
  title: TokensCowork npm Registry
  gravatar: false
  # The public UI/API base is supplied by VERDACCIO_PUBLIC_URL in Compose.
  # Keep this file portable so the registry can move between hosts.

auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    # Public self-registration is disabled. Accounts are provisioned by ops.
    max_users: -1
    algorithm: bcrypt
    rounds: 10

# The Web UI signs in with a JWT. Without an explicit security.api.jwt block
# Verdaccio falls back to legacy AES tokens for API auth, rejects that JWT and
# treats the request as anonymous, so $authenticated packages stay invisible in
# the UI. Keep this block whenever any package requires authentication.
security:
  api:
    jwt:
      sign:
        expiresIn: 60d
  web:
    sign:
      expiresIn: 7d

uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    cache: true
    timeout: 30s
    maxage: 2m

# All product plugins are internal at the storage layer. Market alone decides
# end-user visibility/download grants. Only the publisher and Market can read;
# merely having a Registry account must not bypass Market authorization.
# Use @tokensapi/* for new plugins. The fallback is for third-party dependencies.
packages:
  # Private plugins. Never proxied, so a name here can never resolve to npmjs,
  # and never $authenticated for publish, so the market account stays read-only.
  # This is the actual security boundary of the registry.
  '@tokensapi-private/*':
    access: tokenscowork market
    publish: tokenscowork
    unpublish: tokenscowork

  # Own packages. Proxied while the npmjs copies are being migrated in: a
  # version that only exists upstream still resolves, and Verdaccio merges the
  # local metadata over it. Once a package is fully migrated its proxy can be
  # dropped to make the local copy the only source.
  '@tokensapi/*':
    access: tokenscowork market
    publish: tokenscowork
    unpublish: tokenscowork
    proxy: npmjs
  '@tokens/*':
    access: tokenscowork market
    publish: tokenscowork
    unpublish: tokenscowork
    proxy: npmjs
  'dsh-tokensapi-ui':
    access: tokenscowork market
    publish: tokenscowork
    unpublish: tokenscowork
    proxy: npmjs
  'tokens-dsh-web-search':
    access: tokenscowork market
    publish: tokenscowork
    unpublish: tokenscowork
    proxy: npmjs

  # Everything else: readable by anyone, fetched from npmjs and cached.
  '**':
    access: $all
    publish: tokenscowork
    unpublish: tokenscowork
    proxy: npmjs

server:
  keepAliveTimeout: 60

max_body_size: 200mb

log:
  type: stdout
  format: pretty
  level: http
