# TokensCowork npm Registry.
# Nginx should proxy to http://127.0.0.1:4873.
storage: /verdaccio/storage
plugins: /verdaccio/plugins

web:
  enable: true
  title: TokensCowork npm Registry
  gravatar: false
  # The public UI/API base is supplied by VERDACCIO_PUBLIC_URL in Compose.
  # Keep this file portable so the registry can move between hosts.

auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    # Public self-registration is disabled. Accounts are provisioned by ops.
    max_users: -1
    algorithm: bcrypt
    rounds: 10

# The Web UI signs in with a JWT. Without an explicit security.api.jwt block
# Verdaccio falls back to legacy AES tokens for API auth, rejects that JWT and
# treats the request as anonymous, so $authenticated packages stay invisible in
# the UI. Keep this block whenever any package requires authentication.
security:
  api:
    jwt:
      sign:
        expiresIn: 60d
  web:
    sign:
      expiresIn: 7d

uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    cache: true
    timeout: 30s
    maxage: 2m

# Publishing always requires an ops-provisioned account. Read access is split:
# the private scope needs a login, everything else is public.
packages:
  # Private plugins. Never proxied, so a name here can never resolve to npmjs.
  '@tokensapi-private/*':
    access: $authenticated
    publish: $authenticated
    unpublish: $authenticated

  # Own packages, migrated off npmjs. No proxy: the local copy is the source of
  # truth and must not be merged with npmjs metadata of the same name.
  '@tokensapi/*':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
  '@tokens/*':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
  'dsh-tokensapi-ui':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
  'tokens-dsh-web-search':
    access: $all
    publish: $authenticated
    unpublish: $authenticated

  # Everything else: readable by anyone, fetched from npmjs and cached.
  '**':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
    proxy: npmjs

server:
  keepAliveTimeout: 60

max_body_size: 200mb

log:
  type: stdout
  format: pretty
  level: http
