<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TokensCowork · 插件文档</title>
    <link rel="icon" type="image/svg+xml" href="/admin/assets/logo-mark.svg" />
    <script src="/admin/assets/market-theme.js"></script>
    <link rel="stylesheet" href="/admin/assets/market-docs.css" />
    <script type="module" src="/admin/assets/market-docs.js"></script>
  </head>
  <body class="signed-out">
    <header class="topbar">
      <button id="menu-toggle" class="icon-button menu-toggle" type="button" aria-label="打开目录" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
      </button>
      <a class="logo" href="/docs">
        <img src="/admin/assets/logo-mark.svg" alt="" />
        <span class="logo-name">TokensCowork</span>
        <span class="logo-divider" aria-hidden="true"></span>
        <span class="logo-sub">插件文档</span>
      </a>
      <div class="topbar-actions">
        <label class="theme-select">
          <span class="sr-only">主题外观</span>
          <select id="theme-choice">
            <option value="system">跟随系统</option>
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
        </label>
        <button id="docs-logout" class="text-button signed-in-only" type="button">退出登录</button>
      </div>
    </header>

    <main class="login signed-out-only">
      <form id="docs-login" class="login-card">
        <img class="login-mark" src="/admin/assets/logo-mark.svg" alt="" />
        <h1>登录插件文档</h1>
        <p class="login-lead">查看你有权限使用的 TokensCowork 插件的使用说明。</p>
        <label class="field">
          <span>TokensAPI Key</span>
          <input id="docs-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-..." required />
        </label>
        <p class="field-hint">以 sk- 开头，就是你在 TokensCowork 里填写的那个 Key，只用来确认你能看哪些插件。</p>
        <button class="primary-button" type="submit">登录</button>
        <p id="docs-login-error" class="login-error" role="alert"></p>
      </form>
    </main>

    <div class="layout signed-in-only">
      <aside id="sidebar" class="sidebar" aria-label="插件目录">
        <div class="sidebar-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <input id="docs-search" type="search" placeholder="搜索插件或文档" aria-label="搜索插件或文档" />
        </div>
        <nav id="docs-nav" class="nav"></nav>
      </aside>
      <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

      <main class="content">
        <div class="doc">
          <nav class="breadcrumb" aria-label="当前位置"><span>插件</span><span aria-hidden="true">/</span><span id="docs-crumb"></span></nav>
          <article id="docs-article" class="prose"></article>
          <div id="docs-empty" class="empty" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z" /><path d="M14 3v5h5M9 13h7M9 17h5" /></svg>
            <h2 id="docs-empty-title"></h2>
            <p id="docs-empty-text"></p>
          </div>
          <p id="docs-updated" class="doc-meta"></p>
          <nav id="docs-pager" class="pager" aria-label="上一篇和下一篇"></nav>
        </div>
        <aside class="toc" aria-label="本页目录">
          <p class="toc-title">本页目录</p>
          <ul id="docs-toc"></ul>
        </aside>
      </main>
    </div>
  </body>
</html>
